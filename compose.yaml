services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bk_breakfast}
      POSTGRES_USER: ${DB_USERNAME:-bk_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - bk-postgres-data:/var/lib/postgresql/data

volumes:
  bk-postgres-data:
