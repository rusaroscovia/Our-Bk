<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin login | BK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center py-5">
    <section class="welcome-card login-card mx-auto w-100">
        <a class="brand-mark text-decoration-none" th:href="@{/}">BK</a>
        <p class="eyebrow mb-2">ADMINISTRATION</p>
        <h1 class="h2 fw-semibold mb-2">Welcome back</h1>
        <p class="text-secondary mb-4">Sign in to manage breakfast contributions and records.</p>
        <div class="alert alert-danger" role="alert" th:if="${param.error}">
            The username or password was not accepted.
        </div>
        <div class="alert alert-success" role="alert" th:if="${param.logout}">
            You have been signed out.
        </div>
        <form method="post" th:action="@{/admin/login}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username" name="username" class="form-control form-control-lg"
                       autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control form-control-lg"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-bk btn-lg w-100">Sign in</button>
        </form>
        <a class="d-inline-block mt-4 text-secondary" th:href="@{/}">Back to home</a>
    </section>
</main>
</body>
</html>
