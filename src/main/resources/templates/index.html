<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BK | Breakfast Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center py-5">
    <section class="welcome-card mx-auto w-100">
        <div class="brand-mark" aria-hidden="true">BK</div>
        <p class="eyebrow mb-2">BREAKFAST MANAGEMENT SYSTEM</p>
        <h1 class="display-5 fw-semibold mb-3">Good mornings start here.</h1>
        <p class="lead text-secondary mb-4">
            A simple place to manage breakfast contributions, expenses and daily choices.
        </p>
        <div class="d-flex flex-wrap gap-2 mb-4">
            <a class="btn btn-bk" th:href="@{/vote}">Vote for today's breakfast</a>
            <a class="btn btn-outline-bk" th:href="@{/admin/login}">Administrator login</a>
        </div>
        <div class="setup-note">
            <span class="status-dot" aria-hidden="true"></span>
            Pick today's breakfast together, with simple daily voting and clear reports when published.
        </div>
    </section>
</main>
</body>
</html>
