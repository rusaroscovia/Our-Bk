<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BK | Breakfast Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="home-header">
    <nav class="container home-nav" aria-label="Main navigation">
        <a class="home-brand" th:href="@{/}">
            <span class="brand-mini" aria-hidden="true">BK</span>
            <span>Breakfast</span>
        </a>
        <a class="home-admin-link" th:href="@{/admin/login}">Administrator login</a>
    </nav>
</header>
<main class="home-page container py-5">
    <section class="home-layout">
        <div class="home-intro">
            <p class="eyebrow mb-3">BK BREAKFAST</p>
            <h1 class="mb-3">Choose breakfast for today.</h1>
            <p class="home-description">
                Vote for what we should have, see today's results, and keep track of contributions and expenses.
            </p>
            <a class="btn btn-bk home-vote-link" th:href="@{/vote}">Vote for today's breakfast</a>
        </div>
        <section class="home-menu" aria-labelledby="home-menu-heading">
            <h2 id="home-menu-heading">On the menu</h2>
            <div class="home-products">
                <figure class="home-product">
                    <img th:src="@{/images/bread.png}" alt="Bread" loading="lazy">
                    <figcaption>Bread</figcaption>
                </figure>
                <figure class="home-product">
                    <img th:src="@{/images/chapati.jpg}" alt="Chapati" loading="lazy">
                    <figcaption>Chapati</figcaption>
                </figure>
                <figure class="home-product">
                    <img th:src="@{/images/andazi.jpg}" alt="Andazi" loading="lazy">
                    <figcaption>Andazi</figcaption>
                </figure>
            </div>
        </section>
    </section>
</main>
</body>
</html>
